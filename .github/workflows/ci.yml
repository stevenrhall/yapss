name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly drift check (Mondays, 07:23 UTC -- off the hour to avoid queue contention)
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: Select job to run
        required: true
        default: all
        type: choice
        options:
          - all
          - test
          - test-conda
          - test-conda-dev-env
          - lint
          - docs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ---------------------------------------------------------------- smoke ---
  # Fast single-instance check that gates the full matrix below -- catches an
  # obviously broken push or PR before spending 9 parallel runners on it.
  # Replaces the old standalone tests.yml, which only ran on manual dispatch
  # and so never actually gated anything.
  smoke:
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all", "test"]'), inputs.job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tox.ini

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Test with tox
        env:
          YAPSS_LOGGING: DEBUG
        run: tox -e py314

  # ---------------------------------------------------------------- tests ---
  test:
    needs: smoke
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all", "test"]'), inputs.job)
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full sweep on Linux ...
        os:
          - ubuntu-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        # ... newest two on Windows and macOS.
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tox.ini

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Test with tox
        env:
          YAPSS_LOGGING: DEBUG
          # Keeps coverage filenames unique across runners so they can be combined.
          COVERAGE_SUFFIX: -${{ matrix.os }}
        run: tox

      - name: Upload coverage data
        # always(): a job that fails its tests has still measured everything it
        # ran, and that data is needed for an accurate combined total. Without
        # this, a single failing platform silently drops its lines from the
        # combined report -- which then looks like a coverage regression rather
        # than the test failure it actually is.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .tox/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

  # ------------------------------------------------------------- conda ------
  # Run on PRs and as a weekly canary. cyipopt links conda-forge's own IPOPT
  # build, a materially different path from the pip stack's mseipopt; nothing
  # else here exercises it.
  test-conda:
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "test-conda"]'), inputs.job))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: yapss-test
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install test dependencies
        run: conda env update --name yapss-test --file conda/environment-test.yml

      - name: Install yapss (--no-deps so pip doesn't override the conda-linked solver build)
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Test with pytest
        run: python -m pytest tests/

  # Weekly canary for conda/environment.yml, the yapss-dev contributor dev
  # environment -- not consumed by any other CI job, so nothing else catches
  # it drifting out of resolvability. This remains a weekly/manual-dispatch
  # single-platform check: the dev tooling stack isn't platform-sensitive the
  # way solver behavior is, so running it on every PR or using a 3-machine
  # matrix wouldn't buy much here.
  test-conda-dev-env:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "test-conda-dev-env"]'), inputs.job))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: yapss-dev
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install dev environment
        run: conda env update --name yapss-dev --file conda/environment.yml

      - name: Install yapss (--no-deps so pip doesn't override the conda-linked solver build)
        run: python -m pip install --no-deps --no-build-isolation -e .

      # nbsphinx is the only thing in the project that needs pandoc.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Run sync/pinning checks and full test suite
        run: python -m pytest tests/

      - name: Build docs
        run: python -m sphinx -b html docs/user_guide docs/build -W

  # ------------------------------------------------------------- coverage ---
  report:
    if: always() && needs.test.result != 'skipped'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tox.ini

      - name: Download all coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Combine and report
        # The coverage gate is applied here and only here. `tox.ini` leaves the
        # threshold at 0 so a local `tox -p` -- which can only ever combine one
        # machine's runs, and so cannot reach another platform's branches -- reports
        # without failing. This job has the full matrix's data, which is the only
        # thing the 95% figure was calibrated against.
        env:
          COVERAGE_FAIL_UNDER: 95
        run: tox -e report -- coverage-data

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: warn

  # ----------------------------------------------------------------- lint ---
  lint:
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all", "lint"]'), inputs.job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ruff/isort pin basepython to 3.13; black pins 3.14; mypy pins 3.13 and
      # mypy-floor pins 3.10 (see tox.ini). Install all three Python versions.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.13
            3.14
          cache: pip
          cache-dependency-path: tox.ini

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run linters
        run: tox -e ruff,isort,black,mypy,mypy-floor

  # ----------------------------------------------------------------- docs ---
  docs:
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all", "docs"]'), inputs.job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tox.ini

      # nbsphinx is the only thing in the project that needs pandoc.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Build docs
        run: tox -e docs

      - name: Upload built docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build
          if-no-files-found: error
