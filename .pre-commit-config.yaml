repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [ "--check", "--target-version", "py311" ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # `ruff` is the hook's legacy alias for `ruff-check`, which runs the same command.
      - id: ruff-check
        # pre-commit appends the staged filenames to these args, so the effective scope is
        # src/yapss *plus any staged file not excluded below* -- tools/ included. `tox -e
        # ruff` lints the same set (src/yapss and tools) so the two cannot disagree.
        args: [ "src/yapss" ]
        exclude: "^(tests|docs|examples|utils)/"

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: [ "--check-only" ]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (via tox -e mypy)
        # Calls the CI environment rather than reproducing it. A mirrors-mypy hook
        # installs only what additional_dependencies lists, so casadi and scipy are
        # missing and `follow_imports = silent` turns them into Any -- which changes
        # inference and makes the hook disagree with CI. One source of truth avoids
        # having to keep two pinnings in agreement forever.
        entry: tox -e mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -n auto
        language: system
        pass_filenames: false
