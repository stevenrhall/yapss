version: 2

formats:
  - htmlzip

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  apt_packages:
    - pandoc

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

sphinx:
  builder: html
  configuration: "docs/user_guide/conf.py"
  fail_on_warning: true
