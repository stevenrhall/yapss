name: yapss-test
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - mpmath
  - matplotlib
  # No CasADi ceiling here: the pip-side <=3.7.2 cap is specifically about
  # mseipopt hard-wiring a path into CasADi's bundled IPOPT. This env uses
  # cyipopt (conda-forge's own IPOPT build), so that risk doesn't apply.
  - casadi>=3.6.0
  - cyipopt
  - pytest
  - pytest-cov
  - hatchling
  - hatch-vcs
  # Needed by tests/conda/test_recipes.py to parse pyproject.toml and the
  # conda recipe/environment files for reconciliation checks.
  - toml
  - pyyaml
  - jinja2
