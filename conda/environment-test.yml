name: yapss-test
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - mpmath
  - matplotlib
  # No CasADi ceiling here: the pip-side <=3.7.2 cap is about the layout of the
  # IPOPT bundled inside the CasADi wheel. Conda's CasADi links conda-forge's own
  # IPOPT package instead, so that risk doesn't apply.
  - casadi>=3.6.0
  # See pyproject.toml: PEP 696 type-parameter defaults below Python 3.13.
  - typing_extensions
  - pytest
  - pytest-cov
  - hatchling
  - hatch-vcs
  # Needed by tests/conda/test_recipes.py to parse the conda recipe and
  # environment files for reconciliation checks.
  - pyyaml
  - jinja2
