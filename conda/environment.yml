name: yapss-dev
channels:
  - conda-forge
dependencies:
  # yapss dependencies
  - python>=3.10,<3.15
  - numpy
  - casadi>=3.6.0
  - scipy
  - mpmath
  - matplotlib
  - cyipopt
  # documentation
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-copybutton
  - sphinx_rtd_theme
  - sphinx-llm
  - myst-parser
  - nbsphinx
  - numpydoc
  - furo
  # notebooks
  - jupyterlab
  - jupyterlab_code_formatter
  - jupyterlab-spellchecker
  - ipython
  # needed to execute example notebooks via `jupyter nbconvert`, same as the
  # `doc` extra in pyproject.toml
  - ipykernel
  - nbconvert
  - black[jupyter]==26.5.1
  - isort==8.0.1
  - nbwipers
  # development
  - tox==4.58.0
  - pytest
  - pytest-cov
  - pytest-xdist
  - ruff==0.16.1
  - mypy==1.20.2
  - toml
  - lxml
  - pyyaml
  - hatch
  - pre-commit
  # release tooling -- matches pyproject.toml's dev extra. conda-forge's
  # package for PyPA's `build` is named `python-build`, not `build` (that
  # name on conda-forge is a stale, unmaintained package last published in
  # 2021 and no longer solvable).
  - python-build
  - twine
