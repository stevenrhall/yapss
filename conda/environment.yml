name: yapss-dev
channels:
  - conda-forge
dependencies:
  # yapss dependencies
  # One Python short of pyproject.toml's <3.16: conda-forge has Python 3.15 (at
  # rc2 when pip's cap was raised) but builds CasADi only through 3.14, so a 3.15
  # environment cannot solve. Raise to <3.16 once conda-forge's casadi has a 3.15
  # build.
  - python>=3.11,<3.15
  - numpy
  - casadi>=3.6.0
  - scipy
  - mpmath
  - matplotlib
  # See pyproject.toml: PEP 696 type-parameter defaults below Python 3.13.
  - typing_extensions
  # documentation
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-copybutton
  - sphinx_rtd_theme
  # See pyproject.toml: capped until conf.py supports sphinx-llm 1.1.
  - sphinx-llm<1.1
  - myst-parser
  - nbsphinx
  - numpydoc
  - furo
  # notebooks
  - jupyterlab
  - jupyterlab_code_formatter
  - jupyterlab-spellchecker
  - ipython
  # needed to execute example notebooks via `jupyter nbconvert`, same as the
  # `doc` extra in pyproject.toml
  - ipykernel
  - nbconvert
  - black[jupyter]==26.5.1
  - isort==9.0.1
  - nbwipers
  # development
  - tox==4.63.0
  - pytest
  - pytest-cov
  - pytest-xdist
  - ruff==0.16.7
  - mypy==2.3.1
  - lxml
  - pyyaml
  - hatch
  # hatchling's version comes from the hatch-vcs plugin, a separate package
  # from `hatch` (the CLI) itself. Needed explicitly here because this
  # environment does an editable `pip install --no-build-isolation`, which
  # (unlike a normal pip install) never fetches build-system.requires itself
  # -- it assumes those packages are already present. Same reasoning as
  # conda/environment-test.yml's hatchling/hatch-vcs entries.
  - hatch-vcs
  - pre-commit
  # build verification tooling -- matches pyproject.toml's dev extra. conda-forge's
  # package for PyPA's `build` is named `python-build`, not `build` (that
  # name on conda-forge is a stale, unmaintained package last published in
  # 2021 and no longer solvable).
  - python-build
