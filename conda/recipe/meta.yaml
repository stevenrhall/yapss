{% set name = "yapss" %}
#{% set version = "0.1.0" %}
{% set version = environ.get('GIT_DESCRIBE_TAG').lstrip('v') %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../..
  # url: https://github.com/stevenrhall/yapss/archive/v{{ version }}.tar.gz
  # sha256: generate this with `openssl sha256 <filename>`

build:
  noarch: python
  number: 0

requirements:
  host:
    - python>=3.10,<3.15
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python>=3.10,<3.15
    - numpy
    # No CasADi ceiling here, unlike pyproject.toml. That ceiling guards the pip
    # backend, which binds to the Ipopt library vendored inside the CasADi wheel by a
    # path that is not a public interface; the conda build does not use it, linking
    # conda-forge's own Ipopt through cyipopt instead. Should some future CasADi break
    # YAPSS on conda another way, constrain it in the feedstock recipe and bump the
    # build number -- that ships without a YAPSS release.
    - casadi>=3.6.0
    - scipy
    - mpmath
    - matplotlib
    - cyipopt

outputs:
  - name: yapss
    build:
      script: "{{ PYTHON }} -m pip install . --no-deps -vv"
    requirements:
      host:
        - python>=3.10,<3.15
        - hatchling
        - hatch-vcs
        - pip
      run:
        - python>=3.10,<3.15
        - numpy
        # No CasADi ceiling; see the `run:` section of the top-level requirements.
        - casadi>=3.6.0
        - scipy
        - mpmath
        - matplotlib
        - cyipopt
    test:
      source_files:
        - tests/examples/test_hs071.py
      requires:
        - pytest
      commands:
        - pytest tests/
    about:
      home: https://github.com/stevenrhall/yapss
      summary: "A Python package for solving optimal control problems using pseudospectral methods."
      description: |
        YAPSS is a Python package for numerically solving multi-phase optimal control problems using
        pseudospectral methods, similar to the GPOPS-II algorithm. The package supports multiple
        differentiation methods, including automatic differentiation using CasADi, as well as numerical
        derivatives found by central difference methods for problems that cannot be differentiated by
        automatic methods. YAPSS supports multiple collocation methods, including Legendre-Gauss (LG),
        Legendre-Gauss-Radau (LGR), and Legendre-Gauss-Lobatto (LGL) collocation points. The mesh
        structure can be specified by the user to improve the accuracy of the solution.
      license: MIT
      license_file: LICENSE
      doc_url: https://yapss.readthedocs.io
      dev_url: https://github.com/stevenrhall/yapss

  - name: yapss-dev
    build:
      script: "{{ PYTHON }} -m pip install .[dev] --no-deps -vv"
    requirements:
      host:
        - python>=3.10,<3.15
        - hatchling
        - hatch-vcs
        - pip
      run:
        # yapss dependencies
        - python>=3.10,<3.15
        - numpy
        # No CasADi ceiling; see the `run:` section of the top-level requirements.
        - casadi>=3.6.0
        - scipy
        - mpmath
        - matplotlib
        - cyipopt
        # documentation
        - sphinx
        - sphinxcontrib-bibtex
        - sphinx-copybutton
        - sphinx_rtd_theme
        - sphinx-llm
        - myst-parser
        - nbsphinx
        - numpydoc
        - furo
        # notebooks
        - jupyterlab
        - jupyterlab_code_formatter
        - jupyterlab-spellchecker
        - ipython
        # needed to execute example notebooks via `jupyter nbconvert`, same as
        # the `doc` extra in pyproject.toml
        - ipykernel
        - nbconvert
        # Unpinned, not mirroring pyproject.toml's dev extra pins: this output is
        # published to conda-forge and installed into arbitrary users'
        # environments, where an exact pin risks unsatisfiable solves and forces
        # a rebuild on every pin bump. See tests/conda/test_recipes.py's
        # test_dev_tool_pinning_policy for the reasoning.
        - black[jupyter]
        - isort
        - nbwipers
        # development
        - tox
        - pytest
        - pytest-cov
        - pytest-xdist
        - ruff
        - mypy
        - toml
        - lxml
        - pyyaml
        - hatch
        # See conda/environment.yml for why hatch-vcs is needed alongside hatch.
        - hatch-vcs
        - pre-commit
        # build verification tooling -- matches pyproject.toml's dev extra. conda-forge's
        # package for PyPA's `build` is named `python-build` (see
        # conda/environment.yml for why).
        - python-build
    test:
      source_files:
        - tests/examples/test_hs071.py
      requires:
        - pytest
      commands:
        - pytest tests/
    about:
      home: https://github.com/stevenrhall/yapss
      summary: "Development package for YAPSS, including documentation and testing tools."
      license: MIT
      license_file: LICENSE
      doc_url: https://yapss.readthedocs.io
      dev_url: https://github.com/stevenrhall/yapss

extra:
  recipe-maintainers:
    - stevenrhall
