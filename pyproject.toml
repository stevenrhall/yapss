[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "yapss"
dynamic = ["version"]
description = "A Python package for solving optimal control problems using pseudospectral methods."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
keywords = ["optimal control", "optimization", "pseudospectral methods"]
authors = [{ name = "Steven R. Hall", email = "steve@steven-hall.net" }]
maintainers = [{ name = "Steven R. Hall", email = "steve@steven-hall.net" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Ceiling is a stopgap, not an API-compatibility bet: mseipopt hard-wires a
    # path to CasADi's bundled IPOPT library, which is not a public interface
    # and could move in any release. Pinned to the highest version actually
    # tested. Revisit once mseipopt is no longer the default solver backend.
    "casadi>=3.6.0,<=3.7.2",
    "scipy",
    # Unconstrained deliberately. The NumPy 2.5 breakage (it rewrote
    # numpy.typing.NDArray using PEP 695 `type` statements, which cannot be
    # subclassed directly) is fixed at the source: _private/input_args.py now
    # subclasses np.ndarray directly and is version-agnostic. No ceiling is needed
    # to keep 2.5 away from Python 3.10/3.11 either -- NumPy 2.5 declares
    # requires-python >= 3.12, so pip will not select it there. Both ends of the
    # range are type-checked in CI: see tox's mypy and mypy-floor environments.
    "numpy",
    "mpmath",
    "matplotlib",
]

[project.optional-dependencies]
doc = [
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "sphinx_rtd_theme",
    "sphinx-llm",
    "myst-parser",
    "nbsphinx",
    "numpydoc",
    "jupyterlab",
    # Needed to execute example notebooks via `jupyter nbconvert` in
    # docs/user_guide/notebooks/Makefile -- previously relied on jupyterlab's
    # transitive deps for these.
    "ipykernel",
    "nbconvert",
]
notebook = [
    "jupyterlab",
    "jupyterlab-spellchecker",
    "ipython",
]
dev = [
    "yapss[doc,notebook]",
    # Theme used only by the internal API documentation (`make dev-docs`).
    "furo",
    # jupyter-notebook formatting tools -- dev-only, not forced on end users
    # who just install the `notebook` extra (see notebook extra above)
    "jupyterlab_code_formatter",
    "black[jupyter]==26.5.1",
    "isort==8.0.1",
    # plus development tools
    "tox==4.58.0",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff==0.16.1",
    "mypy==1.20.2",
    "toml",
    "lxml",
    "nbwipers",
    "pyyaml",
    "hatch",
    "pre-commit",
    # release tooling -- used by RELEASE_CHECKLIST.md's build-verification step
    "build",
]

[project.urls]
Documentation = "https://yapss.readthedocs.io/"
Repository = "https://github.com/stevenrhall/yapss.git"
Issues = "https://github.com/stevenrhall/yapss/issues"
Changelog = "https://github.com/stevenrhall/yapss/blob/main/CHANGELOG.md"
Contributing = "https://github.com/stevenrhall/yapss/blob/main/CONTRIBUTING.md"

# ======================================== hatch =========================================

[tool.hatch.version]
source = "vcs"
style = "pep440"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "CHANGELOG.md"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/yapss"]

# ========================================= mypy =========================================

[tool.mypy]
# The minimum supported Python, and the default for a bare `mypy` invocation. Both
# tox mypy environments pass --python-version explicitly and so override it, since
# the target has to be paired with a numpy the target can actually install: numpy
# 2.5's stubs use PEP 695 syntax that a 3.10 target cannot parse, and numpy 2.5
# requires Python 3.12+ at runtime in any case.
python_version = "3.10"
files = ["src/**/*.py"]
follow_imports = "silent"
# numpy.typing.mypy_plugin removed -- deprecated as of NumPy 2.3, will be
# removed entirely in a future NumPy release.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
warn_redundant_casts = true
disallow_incomplete_defs = true
no_implicit_reexport = true

check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "cyipopt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yapss._private.*"
disallow_untyped_calls = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "casadi",
    "scipy.*",
    "matplotlib.*",
    "mpmath",
    "mpl_toolkits.*",
]
ignore_missing_imports = true

# ========================================= ruff =========================================

[tool.ruff]
exclude = ["tests", "docs"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit category list rather than "ALL". "ALL" silently pulls in every new
# rule category ruff adds on each release (e.g. CPY/flake8-copyright showed up
# this way and fired 36 hits for a copyright-header convention this project
# doesn't use) -- an upgrade should be a deliberate scope change, not a
# surprise. Categories left out entirely, and why:
#   AIR, FAST, DJ, PD, INT  -- frameworks/libraries not used in this project
#                              (Airflow, FastAPI, Django, pandas, gettext)
#   CPY                     -- no copyright-header convention
#   PYI                     -- no .pyi stub files
#   ANN                     -- redundant with mypy, which already enforces
#                              annotations more precisely (see [tool.mypy])
#   ERA                     -- single-rule category (ERA001); commented-out
#                              code is allowed deliberately
#   SLF                     -- single-rule category (SLF001); private-member
#                              access from outside a class is allowed
#   C90                     -- single-rule category (C901); no complexity cap,
#                              same reasoning as the PLR0915/PLR0912 ignores
#   I                       -- import sorting is isort's job (separate tox
#                              job); keeping ruff's I001 selected risks the
#                              two tools disagreeing
#   ASYNC, S, DTZ, T10, EXE -- no async code, no security-sensitive surface,
#                              no meaningful datetime/timezone handling, no
#                              manual breakpoints, no shebang scripts
select = [
    "YTT", "BLE", "FBT", "B", "A", "COM", "C4", "EM", "FA", "ISC", "ICN",
    "LOG", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SIM", "SLOT",
    "TID", "TD", "TC", "ARG", "PTH", "FLY", "NPY", "N", "PERF", "E", "W",
    "DOC", "D", "F", "PGH", "PL", "UP", "FURB", "RUF", "TRY", "FIX",
]
ignore = [
    "TC006", # Add quotes to type expression in `typing.cast()` -- none of
             # this project's cast() calls reference a TYPE_CHECKING-only
             # import, so quoting is speculative future-proofing, not a
             # correctness fix; revisit if that changes
    "T201", # `print` found
    "TD002", # Missing author in TODO
    "G004", # Logging statement uses f-string"
    "FIX002", # Line contains TODO, consider resolving the issue
    "TD003", # Missing issue link on the line following this TODO
    "D200", # One-line docstring should fit on one line with quotes
    "PLR0915", # Too many statements
    "PLR0912", # Too many branches
    "ISC001", # causes conflicts with formatter
    "COM812", # causes conflicts with formatter
]
fixable = [
    "A", "B", "C", "D", "E", "F",
    "COM", "PT", "UP", "TRY", "RET", "RUF",
]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
    "*.pyi",
    "src/yapss/_version.py",
    "**/mseipopt/**",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-third-party = ["numpy", "scipy", "matplotlib", "casadi", "pytest"]

# ======================================== black =========================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

# ======================================== isort =========================================

[tool.isort]
profile = "black"
line_length = 100
known_third_party = ["numpy", "scipy", "matplotlib", "casadi", "pytest"]
known_first_party = ["yapss"]
atomic = true

# ======================================== pytest ========================================

[tool.pytest.ini_options]
# No --cov-fail-under here on purpose. Coverage is gated on the *combined*
# data in tox's `report` env, not per test run: each runner in the CI matrix
# can only execute its own platform's code, so a per-runner threshold
# penalizes correct cross-platform code (mseipopt/library.py alone has ~80
# lines that are live on exactly one OS each). See [testenv:report] in tox.ini.
addopts = [
    "--cov-report=term",
    "--strict-markers",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    # Load-order tests that spawn a fresh interpreter per case, because a
    # shared library cannot be unmapped once loaded. Each pays a CasADi
    # import; deselect with -m "not isolation" if CI time gets tight.
    "isolation: runs in a subprocess for a clean library-loading state",
]
filterwarnings = [
    "ignore:.*pkg_resources\\.declare_namespace.*:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API",
    "ignore: invalid escape sequence",
    "ignore:invalid value encountered in divide:RuntimeWarning",
]

# ======================================= coverage =======================================

[tool.coverage.run]
parallel = true
branch = true
# Store relative paths so data from different OSes/subdirectories combines
# correctly -- see [tool.coverage.paths] below, which still handles the
# site-packages vs src/ install-location difference on top of this.
relative_files = true
source = [
    "src/yapss",
    "tests"
]

[tool.coverage.paths]
# A single entry does no remapping. The second pattern aliases the installed
# copy that pytest-cov measures against (tox runs with PYTHONPATH unset, so
# tests exercise site-packages, not src/) back to src/yapss, regardless of OS
# or Python version -- "*/" is treated as "**/", so it matches any nesting
# depth on Linux, macOS, or Windows in one pattern. Needed for the `report`
# job to combine coverage data collected across the 9 test-matrix runners.
source = [
    "src/yapss",
    "*/site-packages/yapss",
]

[tool.coverage.report]
# Two decimals so `--fail-under` compares the real number. At the default
# precision of 0, coverage rounds *before* comparing, so 92.52% is reported as
# "93%" and passes a 93% threshold -- which is precisely the trap that hid a
# genuine shortfall here once already.
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise RuntimeError",
    "if TYPE_CHECKING:",
    "if 0:",
    "if __name__ == .__main__.:",
]
