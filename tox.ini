[tox]
requires =
    tox==4.63.0
    tox-gh-actions==3.5.0
env_list =
    clean
    py{311,312,313,314,315}
    report
    black
    ruff
    isort
    mypy
    mypy-floor
    docs
skip_missing_interpreters = false

[testenv]
description = Run tests with coverage across all supported Python versions
parallel_show_output = true
deps =
    build
    hatchling
    pytest
    pytest-cov
    pyyaml
    jinja2
    numpy
pass_env =
    YAPSS_LOGGING
set_env =
    # {envname} gives py311, py312, ... ; COVERAGE_SUFFIX is set by CI to the
    # runner OS so files from different machines can be combined without collision.
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}{env:COVERAGE_SUFFIX:}
    # coverage leaves SQLite connections unclosed at interpreter shutdown on Python
    # 3.13, printing "ResourceWarning: unclosed database" after the test summary.
    # Not YAPSS's, and not worth more time: absent on 3.10, present with both
    # measurement cores (sysmon and ctrace), present on coverage 7.15.4 which is well
    # past the 7.14.2 connection-closing fix, and not reproducible on a minimal
    # project. tracemalloc cannot locate it either -- sqlite3 raises this warning
    # without `source=`, so no allocation traceback is ever attached.
    #
    # Filtered by message rather than by category, deliberately: a ResourceWarning
    # about an unclosed handle is exactly the kind of thing worth seeing from YAPSS's
    # own ctypes code, and a blanket ignore would hide the next one.
    PYTHONWARNINGS = ignore:unclosed database:ResourceWarning
commands =
    pytest --cov yapss --cov tests
allowlist_externals =
    coverage
depends =
    py{311,312,313,314,315}: clean
    report: py{311,312,313,314,315}

[testenv:clean]
skip_install = true
deps =
    coverage
commands =
    coverage erase

[testenv:report]
description = Combine coverage data and emit a report
skip_install = true
deps =
    coverage
set_env =
    COVERAGE_FILE = .coverage
commands =
    # posargs lets CI point this at a directory of downloaded artifacts:
    #   tox -e report -- coverage-data
    coverage combine {posargs:{toxworkdir}}
    # The project's coverage gate lives here, on the combined data from every
    # runner, rather than in pytest's addopts. A per-run threshold cannot work
    # for a cross-platform matrix: each runner can only execute its own
    # platform's branches, so platform-specific code is unreachable on all but
    # one machine and would be charged against every other.
    #
    # The same argument applies to a local `tox -p`, which combines only one
    # machine's runs: on a Conda machine the entire vendored mseipopt path is
    # unreachable, and `tests/` is measured too, so a file that skips wholesale
    # counts against the total. The threshold is therefore injected rather than
    # written here -- CI sets COVERAGE_FAIL_UNDER=95 for the one run whose data
    # the number was calibrated against, and a local run reports without gating.
    # A gate that fires for structural reasons is a gate people learn to ignore.
    coverage report --fail-under={env:COVERAGE_FAIL_UNDER:0}
    coverage html

# ---------------------------------------------------------------- lint ------
[testenv:black]
skip_install = true
# Pinned ahead of ruff/isort (python3.13) because target-version includes py315:
# black can only fully verify its own py315-formatted output (AST re-parse safety
# check) when run under a 3.15 interpreter itself. Under an older one the check
# still passes, but prints a "cannot parse code formatted for Python 3.15" warning
# on every run. Move it with the newest entry in pyproject's target-version.
basepython = python3.15
deps =
    black[jupyter]==26.5.1
commands =
    black --check src tests tools
    # Notebooks are held to 88 rather than the 100 the rest of the tree uses: any
    # wider and Read the Docs renders the cell with a horizontal scroll bar, which
    # is ugly and hides the right-hand end of the line. Half a guard only -- black
    # cannot split a comment or a docstring, so a notebook can pass this check and
    # still carry an over-wide line; `goddard_problem_1_phase` does today.
    black --check --line-length 88 examples/notebooks

[testenv:ruff]
skip_install = true
basepython = python3.13
deps =
    ruff==0.16.7
commands =
    ruff check src/yapss tools

[testenv:isort]
skip_install = true
basepython = python3.13
deps =
    isort==9.0.1
commands =
    isort --check-only src examples/notebooks tests tools

# Type-checking is split across two environments, `mypy` and `mypy-floor`, because
# a single one cannot represent the supported range. numpy's ndarray typing gains
# precision between releases -- the return type of `.copy()`, shape parameters --
# so results genuinely differ by version, and each Python target has to be paired
# with a numpy that target can actually install.
#
# This env is the upper end: newest Python, newest numpy. Both are pinned exactly,
# like mypy itself, so an upstream release cannot turn CI red on a day nobody
# chose.
#
# `--python-version 3.15` is required rather than stylistic. numpy 2.5's stubs use
# PEP 695 `type` statements, which are 3.12+ syntax, so pyproject's
# `python_version = "3.11"` cannot parse them and mypy aborts before reaching our
# code. numpy 2.5 needs Python 3.12+ at runtime anyway, so (3.11, numpy 2.5) is a
# pairing no user can have. The 3.11 floor is checked by mypy-floor below. numpy is
# pinned at 2.5.3, the first 2.5 release with cp315 wheels, so the pairing is one a
# user on 3.15 can have.
#
# The target is the newest supported Python, but the host is python3.14: mypy checks
# against the --python-version it is given, whatever runs it, and the pre-commit hook
# below runs this env on every commit, so its interpreter should be one every
# contributor has. Move the host to the newest Python once it is a final release.
#
# The pre-commit mypy hook invokes `tox -e mypy` rather than pinning its own
# dependencies: a hook that installs only numpy sees `from casadi import SX` fail,
# and `follow_imports = silent` turns the result into Any, which changes inference
# and makes the hook disagree with CI.
[testenv:mypy]
basepython = python3.14
deps =
    lxml
    mypy==2.3.1
    numpy==2.5.3
# tests/typed is a user's program written with every annotation the API offers: it must
# pass strict mode, and its planted mistakes must each be reported (see its docstring). The
# example scripts are annotated as a user would annotate them, and are checked with
# --strict itself, so "the examples pass mypy --strict" is what CI runs. Libraries without
# type information (scipy, matplotlib's mplot3d) are untyped under pyproject.toml's
# ignore_missing_imports, as they would be for a user without their stubs.
commands =
    mypy --python-version 3.15 src/yapss tests/typed
    mypy --strict --python-version 3.15 src/yapss/examples

# Type-check the other end of the supported range. One numpy version cannot stand
# in for the whole range: ndarray typing gains precision between releases, so a
# construct that needs a cast at one version has a redundant cast at another.
#
# Hosted on python3.11 deliberately -- numpy 2.5 requires Python 3.12, so a 3.11
# environment resolves to the newest numpy 2.4.x by construction. That is exactly the
# pairing a user on the minimum supported Python gets, rather than a combination
# chosen by pinning. Checking (3.11, numpy 2.5) would be meaningless: no user can have
# it -- and its stubs use PEP 695 syntax that a 3.11 target cannot even parse.
[testenv:mypy-floor]
basepython = python3.11
deps =
    lxml
    mypy==2.3.1
    numpy==2.4.6
commands =
    mypy --python-version 3.11 src/yapss tests/typed
    mypy --strict --python-version 3.11 src/yapss/examples

# ---------------------------------------------------------------- docs ------
# Deps come from the `doc` extra in pyproject.toml, which is also what
# .readthedocs.yaml installs -- one source of truth for both builders.
[testenv:docs]
description = Build the Sphinx documentation, check for warnings, and run its doctests
basepython = python3.13
extras =
    doc
commands =
    python -m sphinx -b html docs/user_guide docs/build/html -W
    # The doctests are part of the documentation build rather than a separate env:
    # they are the only check that the examples in the user guide still run.
    python -m sphinx -b doctest docs/user_guide docs/build/doctest -q -W

# `make view-docs` builds through this env rather than calling sphinx itself, so that
# there is one documentation build path and one output tree. It differs from `docs` only
# in dropping -W and the doctests: a page can still be viewed while something on it is
# being debugged. Nothing is lost by that -- `docs` and CI both build with -W, and RTD
# sets fail_on_warning, so a warning still has to be fixed before it can ship. It is not
# in env_list, so `tox -p` does not run it. It gets its own env_dir: sharing one with
# `docs` costs a full recreate ("env type changed") every time the two are alternated,
# which is far more expensive than the second copy of the doc toolchain it would save.
[testenv:docs-view]
description = Build the Sphinx documentation without -W, for local viewing
basepython = python3.13
extras =
    doc
commands =
    python -m sphinx -b html docs/user_guide docs/build/html

# CI runs lint and docs as dedicated jobs, so the matrix maps to tests only.
[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
