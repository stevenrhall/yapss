[tox]
requires =
    tox==4.58.0
    tox-gh-actions==3.5.0
env_list =
    clean
    py{310,311,312,313,314}
    report
    black
    ruff
    isort
    mypy
    docs
skip_missing_interpreters = false

[testenv]
description = Run tests with coverage across all supported Python versions
parallel_show_output = true
deps =
    build
    hatchling
    pytest
    pytest-cov
    toml
    pyyaml
    jinja2
    typing_extensions
    numpy
pass_env =
    YAPSS_LOGGING
set_env =
    # {envname} gives py310, py311, ... ; COVERAGE_SUFFIX is set by CI to the
    # runner OS so files from different machines can be combined without collision.
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}{env:COVERAGE_SUFFIX:}
commands =
    pytest --cov yapss --cov tests
allowlist_externals =
    coverage
depends =
    py{310,311,312,313,314}: clean
    report: py{310,311,312,313,314}

[testenv:clean]
skip_install = true
deps =
    coverage[toml]
commands =
    coverage erase

[testenv:report]
description = Combine coverage data and emit a report
skip_install = true
deps =
    coverage[toml]
set_env =
    COVERAGE_FILE = .coverage
commands =
    # posargs lets CI point this at a directory of downloaded artifacts:
    #   tox -e report -- coverage-data
    coverage combine {posargs:{toxworkdir}}
    coverage report
    coverage html

# ---------------------------------------------------------------- lint ------
[testenv:black]
skip_install = true
basepython = python3.13
deps =
    black[jupyter]==24.10.0
commands =
    black --check src examples/notebooks tests

[testenv:ruff]
skip_install = true
basepython = python3.13
deps =
    ruff==0.8.5
commands =
    ruff check src/yapss

[testenv:isort]
skip_install = true
basepython = python3.13
deps =
    isort==5.13.2
commands =
    isort --check-only src examples/notebooks tests

# Advanced mypy's numpy dependency from <2.0.0 (two generations stale) towards
# 2.4.x. `python_version = "3.10"` in [tool.mypy] (pyproject.toml) still governs
# the actual type-checking target/syntax semantics, independent of the host
# below -- so raising basepython does NOT relax which Python version the code is
# checked for compatibility with. Raising the numpy ceiling itself past 2.5 is a
# separate, deferred decision (numpy 2.5 needs Python 3.12+ at runtime, which
# conflicts with requires-python -- see pyproject.toml's numpy pin).
#
# numpy is pinned to an EXACT version here (like mypy is), not just <2.5: numpy's
# generic ndarray typing (e.g. the return type of `.copy()`) has genuinely
# different mypy-visible behavior across numpy point releases. basepython is set
# to python3.13 (not 3.10) because numpy dropped Python 3.10 wheels entirely as
# of 2.3.0 -- a 3.10-hosted env can never resolve past numpy 2.2.6, no matter
# what upper bound is set here. Keep this numpy pin in sync with the mypy hook's
# additional_dependencies in .pre-commit-config.yaml (which already used
# python3.13 for the same reason).
[testenv:mypy]
basepython = python3.13
deps =
    lxml
    mypy==1.20.2
    numpy==2.4.6
    types-toml
commands =
    mypy src/yapss

# ---------------------------------------------------------------- docs ------
# Deps come from the `doc` extra in pyproject.toml, which is also what
# .readthedocs.yaml installs -- one source of truth for both builders.
[testenv:docs]
description = Build the Sphinx documentation and check for warnings
basepython = python3.13
extras =
    doc
commands =
    python -m sphinx -b html docs/user_guide docs/build -W

# CI runs lint and docs as dedicated jobs, so the matrix maps to tests only.
[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
