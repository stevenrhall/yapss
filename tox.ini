[tox]
requires =
    tox==4.58.0
    tox-gh-actions==3.5.0
env_list =
    clean
    py{310,311,312,313,314}
    report
    black
    ruff
    isort
    mypy
    docs
skip_missing_interpreters = false

[testenv]
description = Run tests with coverage across all supported Python versions
parallel_show_output = true
deps =
    build
    hatchling
    pytest
    pytest-cov
    toml
    pyyaml
    jinja2
    typing_extensions
    numpy
pass_env =
    YAPSS_LOGGING
set_env =
    # {envname} gives py310, py311, ... ; COVERAGE_SUFFIX is set by CI to the
    # runner OS so files from different machines can be combined without collision.
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}{env:COVERAGE_SUFFIX:}
commands =
    pytest --cov yapss --cov tests
allowlist_externals =
    coverage
depends =
    py{310,311,312,313,314}: clean
    report: py{310,311,312,313,314}

[testenv:clean]
skip_install = true
deps =
    coverage[toml]
commands =
    coverage erase

[testenv:report]
description = Combine coverage data and emit a report
skip_install = true
deps =
    coverage[toml]
set_env =
    COVERAGE_FILE = .coverage
commands =
    # posargs lets CI point this at a directory of downloaded artifacts:
    #   tox -e report -- coverage-data
    coverage combine {posargs:{toxworkdir}}
    coverage report
    coverage html

# ---------------------------------------------------------------- lint ------
[testenv:black]
skip_install = true
basepython = python3.13
deps =
    black[jupyter]==24.10.0
commands =
    black --check src examples/notebooks tests

[testenv:ruff]
skip_install = true
basepython = python3.13
deps =
    ruff==0.8.5
commands =
    ruff check src/yapss

[testenv:isort]
skip_install = true
basepython = python3.13
deps =
    isort==5.13.2
commands =
    isort --check-only src examples/notebooks tests

# TODO: NumPy's improved type hints (2.2+) trip mypy. This env is pinned two
# major versions behind the test envs; revisit alongside the <2.5 ceiling.
[testenv:mypy]
basepython = python3.10
deps =
    lxml
    mypy==1.13.0
    numpy<2.0.0
    types-toml
commands =
    mypy src/yapss

# ---------------------------------------------------------------- docs ------
# Deps come from the `doc` extra in pyproject.toml, which is also what
# .readthedocs.yaml installs -- one source of truth for both builders.
[testenv:docs]
description = Build the Sphinx documentation and check for warnings
basepython = python3.13
extras =
    doc
commands =
    python -m sphinx -b html docs/user_guide docs/build -W

# CI runs lint and docs as dedicated jobs, so the matrix maps to tests only.
[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
