[tox]
requires =
    tox==4.58.0
    tox-gh-actions==3.5.0
env_list =
    clean
    py{310,311,312,313,314}
    report
    black
    ruff
    isort
    mypy
    mypy-floor
    docs
skip_missing_interpreters = false

[testenv]
description = Run tests with coverage across all supported Python versions
parallel_show_output = true
deps =
    build
    hatchling
    pytest
    pytest-cov
    toml
    pyyaml
    jinja2
    typing_extensions
    numpy
pass_env =
    YAPSS_LOGGING
set_env =
    # {envname} gives py310, py311, ... ; COVERAGE_SUFFIX is set by CI to the
    # runner OS so files from different machines can be combined without collision.
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}{env:COVERAGE_SUFFIX:}
    # coverage leaves SQLite connections unclosed at interpreter shutdown on Python
    # 3.13, printing "ResourceWarning: unclosed database" after the test summary.
    # Not YAPSS's, and not worth more time: absent on 3.10, present with both
    # measurement cores (sysmon and ctrace), present on coverage 7.15.4 which is well
    # past the 7.14.2 connection-closing fix, and not reproducible on a minimal
    # project. tracemalloc cannot locate it either -- sqlite3 raises this warning
    # without `source=`, so no allocation traceback is ever attached.
    #
    # Filtered by message rather than by category, deliberately: a ResourceWarning
    # about an unclosed handle is exactly the kind of thing worth seeing from YAPSS's
    # own ctypes code, and a blanket ignore would hide the next one.
    PYTHONWARNINGS = ignore:unclosed database:ResourceWarning
commands =
    pytest --cov yapss --cov tests
allowlist_externals =
    coverage
depends =
    py{310,311,312,313,314}: clean
    report: py{310,311,312,313,314}

[testenv:clean]
skip_install = true
deps =
    coverage[toml]
commands =
    coverage erase

[testenv:report]
description = Combine coverage data and emit a report
skip_install = true
deps =
    coverage[toml]
set_env =
    COVERAGE_FILE = .coverage
commands =
    # posargs lets CI point this at a directory of downloaded artifacts:
    #   tox -e report -- coverage-data
    coverage combine {posargs:{toxworkdir}}
    # The project's coverage gate lives here, on the combined data from every
    # runner, rather than in pytest's addopts. A per-run threshold cannot work
    # for a cross-platform matrix: each runner can only execute its own
    # platform's branches, so platform-specific code is unreachable on all but
    # one machine and would be charged against every other.
    #
    # The same argument applies to a local `tox -p`, which combines only one
    # machine's runs: on a Conda machine the entire vendored mseipopt path is
    # unreachable, and `tests/` is measured too, so a file that skips wholesale
    # counts against the total. The threshold is therefore injected rather than
    # written here -- CI sets COVERAGE_FAIL_UNDER=93 for the one run whose data
    # the number was calibrated against, and a local run reports without gating.
    # A gate that fires for structural reasons is a gate people learn to ignore.
    coverage report --fail-under={env:COVERAGE_FAIL_UNDER:0}
    coverage html

# ---------------------------------------------------------------- lint ------
[testenv:black]
skip_install = true
basepython = python3.13
deps =
    black[jupyter]==24.10.0
commands =
    black --check src examples/notebooks tests

[testenv:ruff]
skip_install = true
basepython = python3.13
deps =
    ruff==0.8.5
commands =
    ruff check src/yapss

[testenv:isort]
skip_install = true
basepython = python3.13
deps =
    isort==5.13.2
commands =
    isort --check-only src examples/notebooks tests

# Type-checking is split across two environments, `mypy` and `mypy-floor`, because
# a single one cannot represent the supported range. numpy's ndarray typing gains
# precision between releases -- the return type of `.copy()`, shape parameters --
# so results genuinely differ by version, and each Python target has to be paired
# with a numpy that target can actually install.
#
# This env is the upper end: newest Python, newest numpy. Both are pinned exactly,
# like mypy itself, so an upstream release cannot turn CI red on a day nobody
# chose.
#
# `--python-version 3.13` is required rather than stylistic. numpy 2.5's stubs use
# PEP 695 `type` statements, which are 3.12+ syntax, so pyproject's
# `python_version = "3.10"` cannot parse them and mypy aborts before reaching our
# code. numpy 2.5 needs Python 3.12+ at runtime anyway, so (3.10, numpy 2.5) is a
# pairing no user can have. The 3.10 floor is checked by mypy-floor below.
#
# The pre-commit mypy hook invokes `tox -e mypy` rather than pinning its own
# dependencies: a hook that installs only numpy sees `from casadi import SX` fail,
# and `follow_imports = silent` turns the result into Any, which changes inference
# and makes the hook disagree with CI.
[testenv:mypy]
basepython = python3.13
deps =
    lxml
    mypy==1.20.2
    numpy==2.5.0
    types-toml
commands =
    mypy --python-version 3.13 src/yapss

# Type-check the other end of the supported range. One numpy version cannot stand
# in for the whole range: ndarray typing gains precision between releases, so a
# construct that needs a cast at one version has a redundant cast at another.
#
# Hosted on python3.10 deliberately -- numpy dropped 3.10 wheels as of 2.3.0, so a
# 3.10 environment resolves to numpy 2.2.6 by construction. That is exactly the
# pairing a user on the minimum supported Python gets, rather than a combination
# chosen by pinning. Checking (3.10, numpy 2.5) would be meaningless: numpy 2.5
# requires Python 3.12+, so no user can have it -- and its stubs use PEP 695 syntax
# that a 3.10 target cannot even parse.
[testenv:mypy-floor]
basepython = python3.10
deps =
    lxml
    mypy==1.20.2
    numpy==2.2.6
    types-toml
commands =
    mypy --python-version 3.10 src/yapss

# ---------------------------------------------------------------- docs ------
# Deps come from the `doc` extra in pyproject.toml, which is also what
# .readthedocs.yaml installs -- one source of truth for both builders.
[testenv:docs]
description = Build the Sphinx documentation, check for warnings, and run its doctests
basepython = python3.13
extras =
    doc
commands =
    python -m sphinx -b html docs/user_guide docs/build -W
    # The doctests are part of the documentation build rather than a separate env:
    # they are the only check that the examples in the user guide still run.
    python -m sphinx -b doctest docs/user_guide docs/build/doctest -q -W

# CI runs lint and docs as dedicated jobs, so the matrix maps to tests only.
[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
